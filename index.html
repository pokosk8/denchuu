.<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>電柱番号マップ</title>
<style>
  :root {
    --bg: #0f1923;
    --surface: #1a2636;
    --surface2: #243347;
    --accent: #f5a623;
    --accent2: #e8c84a;
    --text: #e8edf2;
    --text-muted: #7a8fa6;
    --danger: #e05a5a;
    --success: #4caf7d;
    --border: #2d4059;
    --radius: 12px;
    --font-mono: 'Courier New', 'Consolas', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ヘッダー */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon {
    font-size: 24px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--accent);
  }
  .header-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* メインエリア */
  main {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* 検索ボックス */
  .search-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .search-box label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }
  .search-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 18px;
    font-family: var(--font-mono);
    font-weight: 700;
    padding: 10px 14px;
    letter-spacing: 0.05em;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  input[type="text"]::placeholder {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 14px;
  }
  .btn {
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 18px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--accent);
    color: #0f1923;
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-success {
    background: var(--success);
    color: #fff;
  }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1.5px solid var(--danger);
    font-size: 12px;
    padding: 6px 12px;
  }
  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }

  /* 結果カード */
  .result-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-card.found {
    border-color: var(--success);
  }
  .result-card.not-found {
    border-color: var(--accent);
    border-style: dashed;
  }
  .result-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .result-label.ok { color: var(--success); }
  .result-label.ng { color: var(--accent); }

  .pole-number-display {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .coord-display {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-family: var(--font-mono);
  }
  .memo-display {
    font-size: 14px;
    color: var(--text);
    margin: 8px 0;
    padding: 8px;
    background: var(--surface2);
    border-radius: 6px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  /* 登録フォーム */
  .register-form {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    animation: fadeIn 0.2s ease;
  }
  .register-form h2 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 6px;
  }
  .form-group input[type="text"],
  .form-group input[type="number"],
  .form-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 60px;
    font-size: 14px;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
  }
  .coord-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .coord-row .form-group {
    flex: 1;
    margin-bottom: 0;
  }
  .gps-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 20px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .gps-btn:active { transform: scale(0.96); }
  .gps-btn.loading { opacity: 0.5; }
  .gps-status {
    font-size: 12px;
    margin-top: 6px;
    min-height: 16px;
  }
  .gps-status.ok { color: var(--success); }
  .gps-status.err { color: var(--danger); }

  /* 一覧 */
  .list-section {
    margin-top: 24px;
  }
  .list-header {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .list-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .list-item:active {
    background: var(--surface2);
    border-color: var(--accent);
  }
  .list-item-icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .list-item-body {
    flex: 1;
    min-width: 0;
  }
  .list-item-number {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent2);
  }
  .list-item-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .list-item-arrow {
    color: var(--text-muted);
    font-size: 16px;
  }

  /* ステータスメッセージ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 700;
    z-index: 999;
    animation: toastIn 0.2s ease;
    white-space: nowrap;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 32px 0;
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-state .big {
    font-size: 40px;
    margin-bottom: 8px;
  }

  /* Google Mapsリンク */
  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1a73e8;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    transition: opacity 0.15s;
  }
  .map-link:active { opacity: 0.8; }

  /* データ管理 */
  .data-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  /* 推測ボックス */
  .guess-box {
    background: var(--surface2);
    border: 1.5px dashed var(--accent);
    border-radius: 10px;
    padding: 12px;
    margin: 12px 0;
  }
  .guess-label {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .guess-reason {
    font-size: 13px;
    color: var(--text-muted);
    margin: 6px 0;
    line-height: 1.5;
  }

  /* AIボタン */
  .btn-ai {
    background: linear-gradient(135deg, #7b5fe8, #a55fe8);
    color: #fff;
  }
  .btn-ai:disabled {
    opacity: 0.6;
  }

  /* AI結果ボックス */
  .ai-box {
    background: var(--surface2);
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.6;
  }
  .ai-box.ok {
    border: 1.5px solid #a55fe8;
  }
  .ai-box.err {
    border: 1.5px solid var(--danger);
    color: var(--text);
  }

  /* APIキーバッジ */
  .api-key-badge {
    font-size: 11px;
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: border-color 0.15s;
  }
  .api-key-badge:active {
    border-color: var(--accent);
  }

  /* モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    max-width: 420px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: fadeIn 0.2s ease;
  }
  .modal h2 {
    font-size: 16px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .modal-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .modal-help {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<header>
  <span class="header-icon">⚡</span>
  <h1>電柱番号マップ</h1>
  <span class="api-key-badge" id="apiKeyBadge" onclick="openApiKeyModal()">🔑 未設定</span>
  <span class="header-count" id="headerCount">0件</span>
</header>

<main>

  <!-- 検索ボックス -->
  <div class="search-box">
    <label>電柱番号で検索</label>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="例: A1234-5" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn btn-primary" onclick="doSearch()">検索</button>
    </div>
  </div>

  <!-- 結果エリア -->
  <div id="resultArea"></div>

  <!-- 登録フォーム -->
  <div id="registerForm" style="display:none;" class="register-form">
    <h2>📍 新規登録</h2>

    <div class="form-group">
      <label>電柱番号</label>
      <input type="text" id="regNumber" placeholder="A1234-5" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div class="form-group">
      <label>GPS座標</label>
      <div class="coord-row">
        <div class="form-group">
          <label>緯度</label>
          <input type="number" id="regLat" placeholder="36.5944" step="0.000001">
        </div>
        <div class="form-group">
          <label>経度</label>
          <input type="number" id="regLng" placeholder="136.6256" step="0.000001">
        </div>
        <button class="gps-btn" id="gpsBtn" onclick="getGPS()">📡</button>
      </div>
      <div class="gps-status" id="gpsStatus"></div>
    </div>

    <div class="form-group">
      <label>メモ（住所・目印など）</label>
      <textarea id="regMemo" placeholder="例: ○○交差点の北側、△△ビル前"></textarea>
    </div>

    <div style="display:flex; gap:8px; margin-top:4px;">
      <button class="btn btn-success" style="flex:1;" onclick="saveEntry()">💾 登録する</button>
      <button class="btn btn-secondary" onclick="cancelRegister()">キャンセル</button>
    </div>
  </div>

  <hr class="divider">

  <!-- 一覧 -->
  <div class="list-section">
    <div class="list-header">
      <span>登録済み一覧</span>
      <div class="data-actions">
        <button class="btn btn-secondary" style="font-size:11px; padding:5px 10px;" onclick="exportData()">📤 エクスポート</button>
        <label class="btn btn-secondary" style="font-size:11px; padding:5px 10px; cursor:pointer;">
          📥 インポート
          <input type="file" accept=".json" style="display:none;" onchange="importData(event)">
        </label>
      </div>
    </div>
    <div id="listArea"></div>
  </div>

</main>

<!-- APIキー設定モーダル -->
<div id="apiKeyModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>🔑 APIキー設定</h2>
    <p class="modal-desc">
      AnthropicのAPIキーを入力してください。キーは<strong>この端末内だけ</strong>に保存され、外部には送信されません（Anthropic API以外には）。
    </p>
    <div class="form-group">
      <label>APIキー（sk-ant-... で始まる文字列）</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off" autocorrect="off" spellcheck="false" style="width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; padding:10px 12px; outline:none; font-family:var(--font-mono);">
      <div id="apiKeyStatus" style="font-size:12px; margin-top:6px;">未設定</div>
    </div>
    <label style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); margin-bottom:14px; cursor:pointer;">
      <input type="checkbox" id="showKeyCheck" onchange="toggleKeyVisibility()"> キーを表示する
    </label>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-success" style="flex:1;" onclick="submitApiKey()">💾 保存</button>
      <button class="btn btn-danger" onclick="clearApiKey()">🗑 削除</button>
      <button class="btn btn-secondary" onclick="closeApiKeyModal()">閉じる</button>
    </div>
    <div class="modal-help">
      <strong>キーの取得先:</strong><br>
      <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--accent);">console.anthropic.com → API Keys</a><br>
      <span style="color:var(--text-muted); font-size:12px;">※従量課金。電柱推測1回あたり約0.01〜0.03円</span>
    </div>
  </div>
</div>

<script>
function toggleKeyVisibility() {
  const input = document.getElementById('apiKeyInput');
  const check = document.getElementById('showKeyCheck');
  input.type = check.checked ? 'text' : 'password';
}
</script>

<script>
const STORAGE_KEY = 'denchuu_data_v1';

// データ読み込み
function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch(e) {
    return [];
  }
}

// データ保存
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  updateHeaderCount();
  renderList();
}

// ヘッダーカウント更新
function updateHeaderCount() {
  const data = loadData();
  document.getElementById('headerCount').textContent = `${data.length}件`;
}

// 一覧レンダリング
function renderList() {
  const data = loadData();
  const area = document.getElementById('listArea');

  if (data.length === 0) {
    area.innerHTML = `<div class="empty-state">
      <div class="big">🔌</div>
      まだ登録がありません<br>電柱番号を検索して登録してみよう
    </div>`;
    return;
  }

  // 新しい順に表示
  const sorted = [...data].sort((a, b) => b.createdAt - a.createdAt);
  area.innerHTML = sorted.map(entry => `
    <div class="list-item" onclick="showDetail('${entry.id}')">
      <span class="list-item-icon">⚡</span>
      <div class="list-item-body">
        <div class="list-item-number">${escHtml(entry.number)}</div>
        <div class="list-item-sub">${entry.memo ? escHtml(entry.memo) : `${entry.lat.toFixed(5)}, ${entry.lng.toFixed(5)}`}</div>
      </div>
      <span class="list-item-arrow">›</span>
    </div>
  `).join('');
}

// 検索
function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toUpperCase();
  if (!q) return;

  const data = loadData();
  const found = data.filter(e => e.number.toUpperCase() === q);
  const resultArea = document.getElementById('resultArea');
  document.getElementById('registerForm').style.display = 'none';

  if (found.length > 0) {
    const entry = found[0];
    const mapsUrl = `https://www.google.com/maps?q=${entry.lat},${entry.lng}`;
    const svUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${entry.lat},${entry.lng}`;
    resultArea.innerHTML = `
      <div class="result-card found">
        <div class="result-label ok">✅ 登録あり</div>
        <div class="pole-number-display">${escHtml(entry.number)}</div>
        <div class="coord-display">📍 ${entry.lat.toFixed(6)}, ${entry.lng.toFixed(6)}</div>
        ${entry.memo ? `<div class="memo-display">📝 ${escHtml(entry.memo)}</div>` : ''}
        <div class="card-actions">
          <a class="map-link" href="${mapsUrl}" target="_blank">🗺 Mapsで開く</a>
          <a class="map-link" href="${svUrl}" target="_blank" style="background:#34a853;">📷 ストリートビュー</a>
          <button class="btn btn-danger" onclick="deleteEntry('${entry.id}')">🗑 削除</button>
        </div>
      </div>
    `;
  } else {
    // ローカル推測を試みる
    const guess = localGuess(q, data);
    let guessHtml = '';
    if (guess) {
      const gMapsUrl = `https://www.google.com/maps?q=${guess.lat},${guess.lng}`;
      const gSvUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${guess.lat},${guess.lng}`;
      guessHtml = `
        <div class="guess-box">
          <div class="guess-label">📐 番号から推測した位置</div>
          <div class="coord-display">📍 ${guess.lat.toFixed(6)}, ${guess.lng.toFixed(6)}</div>
          <div class="guess-reason">${escHtml(guess.reason)}</div>
          <div class="card-actions">
            <a class="map-link" href="${gMapsUrl}" target="_blank">🗺 推測地点をMapsで開く</a>
            <a class="map-link" href="${gSvUrl}" target="_blank" style="background:#34a853;">📷 ストリートビュー</a>
          </div>
        </div>
      `;
    }
    resultArea.innerHTML = `
      <div class="result-card not-found">
        <div class="result-label ng">❓ 未登録</div>
        <div class="pole-number-display">${escHtml(q)}</div>
        <div style="color: var(--text-muted); font-size:14px; margin-bottom:12px;">この番号はまだ登録されていません</div>
        ${guessHtml}
        <div class="card-actions">
          <button class="btn btn-ai" id="aiGuessBtn" onclick="aiGuess('${escHtml(q)}')">🤖 AIで推測する</button>
          <button class="btn btn-ghost" onclick="openRegister('${escHtml(q)}')">📍 この番号を登録する</button>
          <a class="map-link" href="https://www.google.com/maps/search/${encodeURIComponent(q)}" target="_blank" style="background:#5f6368;">🔍 Googleで検索</a>
        </div>
        <div id="aiResult"></div>
      </div>
    `;
  }
}

// 登録フォームを開く
function openRegister(number = '') {
  document.getElementById('regNumber').value = number;
  document.getElementById('regLat').value = '';
  document.getElementById('regLng').value = '';
  document.getElementById('regMemo').value = '';
  document.getElementById('gpsStatus').textContent = '';
  document.getElementById('registerForm').style.display = 'block';
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('registerForm').scrollIntoView({behavior: 'smooth'});
}

// 登録キャンセル
function cancelRegister() {
  document.getElementById('registerForm').style.display = 'none';
}

// GPS取得
function getGPS() {
  const btn = document.getElementById('gpsBtn');
  const status = document.getElementById('gpsStatus');

  if (!navigator.geolocation) {
    status.textContent = 'このブラウザはGPSに対応していません';
    status.className = 'gps-status err';
    return;
  }

  btn.textContent = '⏳';
  btn.classList.add('loading');
  status.textContent = '取得中...';
  status.className = 'gps-status';

  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('regLat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('regLng').value = pos.coords.longitude.toFixed(6);
      btn.textContent = '📡';
      btn.classList.remove('loading');
      status.textContent = `✅ 取得完了（精度: ±${Math.round(pos.coords.accuracy)}m）`;
      status.className = 'gps-status ok';
    },
    err => {
      btn.textContent = '📡';
      btn.classList.remove('loading');
      status.textContent = `❌ GPS取得失敗: ${err.message}`;
      status.className = 'gps-status err';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// 登録保存
function saveEntry() {
  const number = document.getElementById('regNumber').value.trim().toUpperCase();
  const lat = parseFloat(document.getElementById('regLat').value);
  const lng = parseFloat(document.getElementById('regLng').value);
  const memo = document.getElementById('regMemo').value.trim();

  if (!number) { alert('電柱番号を入力してください'); return; }
  if (isNaN(lat) || isNaN(lng)) { alert('GPS座標を入力またはGPS取得してください'); return; }
  if (lat < 20 || lat > 50 || lng < 120 || lng > 150) {
    if (!confirm('座標が日本国内の範囲外です。このまま登録しますか？')) return;
  }

  const data = loadData();

  // 重複チェック
  const existing = data.find(e => e.number.toUpperCase() === number);
  if (existing) {
    if (!confirm(`「${number}」はすでに登録済みです。上書きしますか？`)) return;
    const idx = data.indexOf(existing);
    data[idx] = { ...existing, lat, lng, memo, updatedAt: Date.now() };
  } else {
    data.push({
      id: Date.now().toString(),
      number,
      lat,
      lng,
      memo,
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
  }

  saveData(data);
  document.getElementById('registerForm').style.display = 'none';
  showToast('✅ 登録しました！');

  // 登録した番号を検索して表示
  document.getElementById('searchInput').value = number;
  doSearch();
}

// 削除
function deleteEntry(id) {
  if (!confirm('この電柱情報を削除しますか？')) return;
  const data = loadData().filter(e => e.id !== id);
  saveData(data);
  document.getElementById('resultArea').innerHTML = '';
  showToast('🗑 削除しました');
}

// エクスポート
function exportData() {
  const data = loadData();
  if (data.length === 0) { alert('登録データがありません'); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `denchuu_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

// インポート
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('形式エラー');
      const data = loadData();
      let added = 0, skipped = 0;
      imported.forEach(entry => {
        if (!entry.number || !entry.lat || !entry.lng) { skipped++; return; }
        const exists = data.find(d => d.number.toUpperCase() === entry.number.toUpperCase());
        if (!exists) {
          data.push({ ...entry, id: entry.id || Date.now().toString() + Math.random() });
          added++;
        } else {
          skipped++;
        }
      });
      saveData(data);
      showToast(`📥 ${added}件追加（${skipped}件スキップ）`);
    } catch(err) {
      alert('インポートに失敗しました: ' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// トースト表示
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ===== 番号パース =====
// 「イ123」「イ123-4」などを {prefix:'イ', num:123, sub:4} に分解
function parseNumber(str) {
  const s = String(str).trim();
  // カタカナ/英字などの接頭部 ＋ 数字 ＋ (任意の枝番)
  const m = s.match(/^([^\d]*?)(\d+)(?:[-‐ー－](\d+))?$/);
  if (!m) return null;
  return {
    prefix: m[1] || '',
    num: parseInt(m[2], 10),
    sub: m[3] != null ? parseInt(m[3], 10) : null,
    raw: s
  };
}

// ===== ローカル推測 =====
// 同じprefixで番号が近い登録データから座標を補間
function localGuess(query, data) {
  const target = parseNumber(query);
  if (!target) return null;

  // 同じ接頭部を持つ登録済みを集めて番号順に
  const sameLine = data
    .map(e => ({ ...e, parsed: parseNumber(e.number) }))
    .filter(e => e.parsed && e.parsed.prefix === target.prefix)
    .sort((a, b) => a.parsed.num - b.parsed.num);

  if (sameLine.length === 0) return null;

  // 完全一致は呼ばれない前提。番号差が一番近い2点を探す
  // 下側（targetより小さい最大）と上側（targetより大きい最小）
  let lower = null, upper = null;
  for (const e of sameLine) {
    if (e.parsed.num <= target.num) {
      if (!lower || e.parsed.num > lower.parsed.num) lower = e;
    }
    if (e.parsed.num >= target.num) {
      if (!upper || e.parsed.num < upper.parsed.num) upper = e;
    }
  }

  // 両側にデータあり → 線形補間
  if (lower && upper && lower !== upper && upper.parsed.num !== lower.parsed.num) {
    const ratio = (target.num - lower.parsed.num) / (upper.parsed.num - lower.parsed.num);
    const lat = lower.lat + (upper.lat - lower.lat) * ratio;
    const lng = lower.lng + (upper.lng - lower.lng) * ratio;
    const gap = upper.parsed.num - lower.parsed.num;
    return {
      lat, lng,
      reason: `「${target.prefix}${lower.parsed.num}」と「${target.prefix}${upper.parsed.num}」の間を補間（番号差${gap}）。${gap <= 5 ? '精度高め' : gap <= 20 ? '精度中' : '精度低め・参考程度'}`
    };
  }

  // 片側だけ → 一番近い点をそのまま提示
  const nearest = lower || upper;
  const diff = Math.abs(nearest.parsed.num - target.num);
  return {
    lat: nearest.lat,
    lng: nearest.lng,
    reason: `同じ「${target.prefix}」線で最も近い「${nearest.number}」の位置（番号差${diff}）。${diff <= 5 ? 'すぐ近くの可能性' : '方向は不明・参考程度'}`
  };
}

// ===== AI推測（Claude API）=====
async function aiGuess(query) {
  const btn = document.getElementById('aiGuessBtn');
  const aiResult = document.getElementById('aiResult');
  const data = loadData();

  if (data.length < 2) {
    aiResult.innerHTML = `<div class="ai-box err">⚠️ AI推測には最低2件以上の登録データが必要です。まずデータを貯めましょう。</div>`;
    return;
  }

  btn.textContent = '🤖 推測中...';
  btn.disabled = true;
  aiResult.innerHTML = `<div class="ai-box">🤖 AIが分析中...</div>`;

  // 登録データをコンパクトに（番号・座標・メモのみ）
  const compact = data.map(e => ({
    番号: e.number,
    緯度: e.lat,
    経度: e.lng,
    メモ: e.memo || ''
  }));

  const prompt = `あなたは日本の電柱番号と位置の専門家です。北陸電力エリアの電柱番号体系を踏まえ、登録済みデータから未登録の電柱番号の位置を推測してください。

【電柱番号の特性】
- カタカナ接頭部（例「イ」「ロ」）は幹線・エリアを表すことが多い
- 数字は同一線内の連番で、番号が近いほど地理的にも近い傾向
- 枝番（-の後ろ）は分岐を表す

【登録済みデータ】
${JSON.stringify(compact, null, 2)}

【推測したい番号】
${query}

以下のJSON形式のみで回答してください（前置き・コードブロック・説明文なし）:
{"lat": 緯度の数値, "lng": 経度の数値, "confidence": "高"または"中"または"低", "reason": "推測根拠を簡潔に日本語で"}

もし推測が全く不可能な場合は {"lat": null, "lng": null, "confidence": "低", "reason": "理由"} としてください。`;

  try {
    const apiKey = getApiKey();
    if (!apiKey) {
      btn.textContent = '🤖 AIで推測する';
      btn.disabled = false;
      aiResult.innerHTML = `<div class="ai-box err">🔑 APIキーが未設定です。下の「⚙️ APIキー設定」から登録してください。</div>`;
      openApiKeyModal();
      return;
    }

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`API エラー (${response.status}): ${errText.slice(0, 200)}`);
    }

    const result = await response.json();
    const text = result.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('')
      .replace(/```json|```/g, '')
      .trim();

    const guess = JSON.parse(text);

    btn.textContent = '🤖 AIで推測する';
    btn.disabled = false;

    if (guess.lat == null || guess.lng == null) {
      aiResult.innerHTML = `<div class="ai-box err">🤖 AIの推測: 位置を特定できませんでした<br><span style="font-size:13px;">${escHtml(guess.reason || '')}</span></div>`;
      return;
    }

    const confColor = guess.confidence === '高' ? 'var(--success)' : guess.confidence === '中' ? 'var(--accent)' : 'var(--danger)';
    const mapsUrl = `https://www.google.com/maps?q=${guess.lat},${guess.lng}`;
    const svUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${guess.lat},${guess.lng}`;

    aiResult.innerHTML = `
      <div class="ai-box ok">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:18px;">🤖</span>
          <strong>AI推測結果</strong>
          <span style="margin-left:auto; font-size:12px; background:${confColor}; color:#0f1923; padding:2px 10px; border-radius:12px; font-weight:700;">確信度: ${escHtml(guess.confidence)}</span>
        </div>
        <div class="coord-display">📍 ${Number(guess.lat).toFixed(6)}, ${Number(guess.lng).toFixed(6)}</div>
        <div class="guess-reason">${escHtml(guess.reason)}</div>
        <div class="card-actions">
          <a class="map-link" href="${mapsUrl}" target="_blank">🗺 Mapsで開く</a>
          <a class="map-link" href="${svUrl}" target="_blank" style="background:#34a853;">📷 ストリートビュー</a>
          <button class="btn btn-ghost" style="font-size:12px;" onclick="adoptGuess('${escHtml(query)}', ${guess.lat}, ${guess.lng})">✅ これで登録</button>
        </div>
      </div>
    `;
  } catch (err) {
    btn.textContent = '🤖 AIで推測する';
    btn.disabled = false;
    aiResult.innerHTML = `<div class="ai-box err">❌ AI推測に失敗しました: ${escHtml(err.message)}</div>`;
  }
}

// AI推測結果を登録フォームに反映
function adoptGuess(number, lat, lng) {
  openRegister(number);
  document.getElementById('regLat').value = Number(lat).toFixed(6);
  document.getElementById('regLng').value = Number(lng).toFixed(6);
  document.getElementById('gpsStatus').textContent = '🤖 AI推測値が入っています。現地確認して修正してください。';
  document.getElementById('gpsStatus').className = 'gps-status';
}

// ===== APIキー管理 =====
const API_KEY_STORAGE = 'denchuu_api_key';

function getApiKey() {
  try {
    return localStorage.getItem(API_KEY_STORAGE) || '';
  } catch(e) {
    return '';
  }
}

function saveApiKey(key) {
  localStorage.setItem(API_KEY_STORAGE, key);
}

function openApiKeyModal() {
  document.getElementById('apiKeyModal').style.display = 'flex';
  const current = getApiKey();
  const input = document.getElementById('apiKeyInput');
  input.value = current;
  updateApiKeyStatus();
  setTimeout(() => input.focus(), 100);
}

function closeApiKeyModal() {
  document.getElementById('apiKeyModal').style.display = 'none';
}

function submitApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    if (confirm('APIキーを空にして保存しますか？（AI推測が使えなくなります）')) {
      saveApiKey('');
      closeApiKeyModal();
      updateApiKeyBadge();
    }
    return;
  }
  if (!key.startsWith('sk-ant-')) {
    if (!confirm('「sk-ant-」で始まらないキーです。このまま保存しますか？')) return;
  }
  saveApiKey(key);
  closeApiKeyModal();
  updateApiKeyBadge();
  showToast('🔑 APIキーを保存しました');
}

function updateApiKeyStatus() {
  const key = getApiKey();
  const status = document.getElementById('apiKeyStatus');
  if (!status) return;
  if (key) {
    const masked = key.slice(0, 12) + '••••••' + key.slice(-4);
    status.textContent = `現在: ${masked}`;
    status.style.color = 'var(--success)';
  } else {
    status.textContent = '未設定';
    status.style.color = 'var(--text-muted)';
  }
}

function updateApiKeyBadge() {
  const badge = document.getElementById('apiKeyBadge');
  if (!badge) return;
  badge.textContent = getApiKey() ? '🔑 設定済' : '🔑 未設定';
  badge.style.color = getApiKey() ? 'var(--success)' : 'var(--text-muted)';
}

function clearApiKey() {
  if (!confirm('保存中のAPIキーを削除しますか？')) return;
  saveApiKey('');
  updateApiKeyStatus();
  updateApiKeyBadge();
  showToast('🗑 APIキーを削除しました');
}

// XSSエスケープ
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Enterキーで検索
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// 初期化
updateHeaderCount();
renderList();
updateApiKeyBadge();
</script>
